version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: swp-postgres
    environment:
      POSTGRES_DB: swp_db
      POSTGRES_USER: swp_user
      POSTGRES_PASSWORD: swp_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swp_user -d swp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swp-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx/emqx:5.3
    container_name: swp-emqx
    environment:
      EMQX_NAME: swp-emqx
      EMQX_HOST: 127.0.0.1
      EMQX_Dashboard__default_username: admin
      EMQX_Dashboard__default_password: public
    ports:
      - "1884:1883"     # MQTT
      - "8884:8883"     # MQTT/TLS
      - "8085:8083"     # WebSocket
      - "8086:8084"     # WebSocket/TLS
      - "18084:18083"   # Dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_logs:/opt/emqx/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18083/api/v5/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  emqx_logs: