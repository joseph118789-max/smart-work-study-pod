; PlatformIO Configuration for SWP Edge Controller
; Target: ESP32-based smart lock controller

[env:swp-controller]
platform = espressif32
board = esp32dev
framework = arduino

upload_speed = 115200
monitor_speed = 115200

lib_deps = 
    mqtt@^5.3.0
    ArduinoJson@^6.21.3
    WiFiManager@^2.1.1

build_flags =
    -DWIFI_SSID=\"${WIFI_SSID}\"
    -DWIFI_PASSWORD=\"${WIFI_PASSWORD}\"
    -DMQTT_BROKER=\"${MQTT_BROKER}\"
    -DMQTT_PORT=1883
    -DMQTT_USERNAME=\"${MQTT_USERNAME}\"
    -DMQTT_PASSWORD=\"${MQTT_PASSWORD}\"

; Board Configuration
; - GPIO 4: Lock relay signal
; - GPIO 5: Status LED
; - GPIO 2: Door sensor (magnetic)
; - I2C: OLED Display (optional)
; - UART: RS485 for keypad (optional)